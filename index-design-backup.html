



<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balina</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
    }

    .search {
      padding: 15px;
      background: white;
    }

    .search input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .container {
      padding: 15px;
    }

    h2 {
      margin: 20px 0 12px;
      font-size: 20px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .category {
      background: white;
      padding: 18px 10px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product {
      background: white;
      border-radius: 12px;
      margin-bottom: 8px;    
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .product-image {
      height: 140px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
    }
.product-image a {
  display: block;
  width: 100%;
  height: 100%;
}
.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
    .product-info {
      padding: 10px;
    }

    .product h3 {
      font-size: 15px;
      font-weight: 700;    
      margin-bottom: 8px;
    }

    .price {
      font-weight: 700;
      font-size: 18px;    
       margin-bottom: 10px;
    }

    .whatsapp {
      display: block;
      width: 100%;
      padding: 10px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 8px;    
      border: none;
      border-radius: 8px;
      background: #25D366;
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>Balina 🛍️</h1>
  <p>لقاها فالبال... تلقاها فـ Balina</p>
</header>

<div class="search">
<input type="text" id="searchInput" placeholder="🔎 قلب على السلعة..."></div>

<div class="container">

  <h2>الأقسام</h2>

  <div class="categories">
<div class="category" data-category="الكل">🛍️ الكل</div>
<div class="category" data-category="ملابس">👕 ملابس</div>
<div class="category" data-category="صبابط">👟 صبابط</div>
<div class="category" data-category="إلكترونيات">📱 إلكترونيات</div>
<div class="category" data-category="أثاث">🪑 أثاث</div>
  </div>

  <h2>آخر المنتجات</h2>

  <div class="products">


</div>
<div id="emptyMessage" style="display:none; text-align:center; padding:35px 15px; margin-top:15px; background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.08); font-size:16px; font-weight:700;"></div>
</body>
</html>
<script>
const searchInput = document.getElementById('searchInput');
let selectedCategory = 'الكل';
searchInput.addEventListener('input', function () {
  const search = this.value.toLowerCase();

  document.querySelectorAll('.product').forEach(function (product) {
    const name = product.querySelector('h3').textContent.toLowerCase();

    if (name.includes(search)) {
      product.style.display = '';
    } else {
      product.style.display = 'none';
    }
  });
});
document.querySelectorAll('.category').forEach(function (category) {
  category.addEventListener('click', function () {
 selectedCategory = this.dataset.category;
const products = document.querySelectorAll('.product');
let found = false;
if (selectedCategory === 'الكل') {
  products.forEach(function (product) {
    product.style.display = '';
  });
document.getElementById('emptyMessage').style.display = 'none';
  return;
}
    document.querySelectorAll('.product').forEach(function (product) {
      const productCategory = product.querySelector('.product-info').dataset.category;

if (productCategory === selectedCategory) {
  product.style.display = '';
  found = true;
} else {
  product.style.display = 'none';
}
    });
if (found) {
  document.getElementById('emptyMessage').style.display = 'none';
}
if (!found) {
document.getElementById('emptyMessage').textContent = '😕 ما كاين حتى منتج فهاد القسم حالياً، رجع قريب إن شاء الله ❤️';
document.getElementById('emptyMessage').style.display = 'block';
} 
 });
});
fetch('/api/products')
  .then(response => response.json())
  .then(products => {
    const container = document.querySelector('.products');

    container.innerHTML = '';

    products.forEach(product => {
      const card = document.createElement('div');
      card.className = 'product';
card.innerHTML = `
  <div class="product-image">
    <a href="product.html?id=${product.id}">
      <img src="${product.image ? 'images/' + product.image : ''}" alt="${product.name}" style="width:100%;height:100%;object-fit:cover;">
    </a>
  </div>
<div class="product-info" data-category="${product.category}">

  <a href="product.html?id=${product.id}" style="text-decoration:none;color:inherit;">
      <h3>${product.name}</h3>
    </a>

    <div class="price">${product.price} درهم</div>

    <div class="condition">الحالة: ${product.condition} 👍</div>

    <a class="whatsapp" href="https://wa.me/212687395300?text=السلام%20عليكم،%20بغيت%20نطلب%20${encodeURIComponent(product.name)}%20بثمن%20${product.price}%20درهم%20من%20Balina" target="_blank">
      📲 طلب عبر WhatsApp
    </a>
  </div>
`;
  container.appendChild(card);
    });
  });</script>
</html>
