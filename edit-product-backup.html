<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balina - تعديل المنتج</title>

<style>
    :root {
      --gold: #C9A227;
      --gold-light: #E5C158;
      --black: #111;
      --gray-light: #f5f5f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: var(--gray-light);
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      border-top: 4px solid var(--gold);
    }

    h1 {
      text-align: center;
      color: var(--black);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
      color: var(--black);
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--gold);
    }

    textarea {
      min-height: 100px;
    }

    #currentImage {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: var(--black);
      color: var(--gold-light);
      font-size: 17px;
      font-weight: bold;
    }
  </style>

</head>

<body>

<div class="box">

  <h1>✏️ تعديل المنتج</h1>

  <label>اسم المنتج</label>
  <input type="text" id="name">

  <label>الثمن</label>
  <input type="number" id="price">

  <label>الحالة</label>
  <input type="text" id="condition">

  <label>الوصف</label>
  <textarea id="description"></textarea>

  <label>الصورة الحالية</label>
  <img id="currentImage" src="" alt="صورة المنتج">

  <label>تبديل الصورة</label>
  <input type="file" id="imageFile" accept="image/*">

</div>

<button onclick="saveEdit()">💾 حفظ التعديلات</button>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');

let currentProduct = null;

fetch('/api/products')
  .then(response => response.json())
  .then(products => {
    currentProduct = products.find(product => product.id == id);

    if (!currentProduct) {
      alert('المنتج ما تلقاش');
      return;
    }

    document.getElementById('name').value = currentProduct.name || '';
    document.getElementById('price').value = currentProduct.price || '';
    document.getElementById('condition').value = currentProduct.condition || '';
    document.getElementById('description').value = currentProduct.description || '';

    if (currentProduct.image) {
      document.getElementById('currentImage').src = currentProduct.image;
    }
  });

function saveEdit() {
  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  const condition = document.getElementById('condition').value;
  const description = document.getElementById('description').value;

  fetch('/api/products/' + id, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      name: name,
      price: Number(price),
      condition: condition,
      description: description
    })
  })
  .then(response => response.json())
  .then(() => {
    alert('تم حفظ التعديلات بنجاح ✅');
    window.location.href = 'admin.html';
  })
  .catch(error => {
    console.error(error);
    alert('وقع مشكل أثناء الحفظ');
  });
}
</script>

</body>
</html>
