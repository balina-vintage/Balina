<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balina - تفاصيل المنتج</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      padding: 15px;
    }

    .product-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .product-image {
      height: 280px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
    }
.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

    .info {
      padding: 18px;
    }

    h2 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 12px 0;
    }

    .details {
      line-height: 1.8;
      color: #555;
      margin-bottom: 20px;
    }

    .whatsapp {
      display: block;
      width: 100%;
      padding: 14px;
      background: #25D366;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
    }

    .back {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #333;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Balina 🛍️</h1>
</header>

<div class="container">

  <div class="product-card">

    <div class="product-image">
    </div>

    <div class="info">

      <h2>جاكيطة مستعملة</h2>

      <div class="price">
        100 درهم
      </div>

      <div class="product-image">
  <img id="productImage" onclick="openImageModal()" src="" alt="صورة المنتج">
<div id="productGallery" style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;"></div>
<div id="imageModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center;"><button id="prevImage" style="position:absolute;  right:15px; font-size:40px; background:none; border:0; color:white;">❮</button><img id="modalImage" src="" style="max-width:95%; max-height:95%; object-fit:contain;"><button id="nextImage" style="position:absolute; left:15px; font-size:40px; background:none; border:0; color:white;">❯</button></div>
</div>
<div class="details">
        الحالة: مزيانة 👍<br>
        النوع: جاكيطة<br>
        المكان: مراكش<br>
        المصدر: محل بال
      </div>

      <a class="whatsapp"
         href="https://wa.me/212687395300?text=السلام%20عليكم،%20بغيت%20نطلب%20الجاكيطة%20من%20Balina"
         target="_blank">
        📲 طلب عبر WhatsApp
      </a>

      <a class="back" href="/">
        ← رجوع للمنتجات
      </a>

    </div>

  </div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
const id = new URLSearchParams(window.location.search).get('id');

if (id) {
  fetch('/api/products')
    .then(response => response.json())
    .then(products => {
      const product = products.find(p => p.id === Number(id));

      if (product) {
        document.querySelector('h2').textContent = product.name;
        document.querySelector('.price').textContent = product.price + ' درهم';
document.getElementById('productImage').src = 'images/' + product.image;      
window.openImageModal = function() {
  const mainImage = document.getElementById('productImage');
  const modal = document.getElementById('imageModal');
  const modalImage = document.getElementById('modalImage');

  modalImage.src = mainImage.src;
  modal.style.display = 'flex';
}

document.getElementById('imageModal').onclick = function() {
  this.style.display = 'none';
};
let currentImageIndex = 0;
let touchStartX = 0;
let touchEndX = 0;

document.getElementById('modalImage').addEventListener('touchstart', function(event) {
  touchStartX = event.touches[0].clientX;
});

document.getElementById('modalImage').addEventListener('touchend', function(event) {
  touchEndX = event.changedTouches[0].clientX;

  if (touchStartX - touchEndX > 50) {
    document.getElementById('nextImage').click();
  }

  if (touchEndX - touchStartX > 50) {
    document.getElementById('prevImage').click();
  }
});
document.getElementById('prevImage').onclick = function(event) {
  event.stopPropagation();
  currentImageIndex =
    (currentImageIndex - 1 + images.length) % images.length;
  document.getElementById('modalImage').src =
    'images/' + images[currentImageIndex];
};

document.getElementById('nextImage').onclick = function(event) {
  event.stopPropagation();
  currentImageIndex =
    (currentImageIndex + 1) % images.length;
  document.getElementById('modalImage').src =
    'images/' + images[currentImageIndex];
};
const gallery = document.getElementById('productGallery');
gallery.innerHTML = '';

const images = product.images || [product.image];

images.forEach((image, index) => {
  const img = document.createElement('img');
  img.src = 'images/' + image;
  img.style.width = '65px';
  img.style.height = '65px';
  img.style.objectFit = 'cover';
  img.style.margin = '5px';
  img.style.cursor = 'pointer';
  img.onclick = () => {
    document.getElementById('productImage').src = 'images/' + image;
  };
  gallery.appendChild(img);
});
  document.querySelector('.details').innerHTML =
          'الحالة: ' + product.condition + ' 👍<br>' +
          'التصنيف: ' + product.category + '<br>' +
          'المكان: مراكش<br>' +
          'الوصف: ' + product.description;
      }
    });
}
  if (params.get('product') === 'shoes') {
    document.querySelector('h2').textContent = 'سبرديلة مستعملة';
    document.querySelector('.price').textContent = '80 درهم';

    document.querySelector('.details').innerHTML =
      'الحالة: مزيانة 👍<br>' +
      'النوع: سبرديلة<br>' +
      'المكان: مراكش<br>' +
      'المصدر: محل بال';
  }
</script>
</body>
</html>
