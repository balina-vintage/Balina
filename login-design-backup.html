<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balina - تسجيل الدخول</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      width: 90%;
      max-width: 350px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #error {
      color: red;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>🔒 دخول الأدمين</h1>
  <p id="error">كلمة السر غلط</p>
  <input type="password" id="password" placeholder="كلمة السر">
  <button onclick="login()">دخول</button>
</div>

<script>
function login() {
  const password = document.getElementById('password').value;

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        window.location.href = '/admin.html';
      } else {
        document.getElementById('error').style.display = 'block';
      }
    });
}
</script>

</body>
</html>
