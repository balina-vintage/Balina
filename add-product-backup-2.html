<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balina - إضافة منتج</title>

<style>
    :root {
      --gold: #C9A227;
      --gold-light: #E5C158;
      --black: #111;
      --gray-light: #f5f5f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: var(--gray-light);
      padding: 20px;
    }

    .box {
      max-width: 520px;
      margin: 30px auto;
      background: white;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
      border: 1px solid #eeeeee;
      border-top: 5px solid var(--gold);
    }

    h1 {
text-align: center;
color: var(--gold);
font-size: 28px;
font-weight: 900;
margin-bottom: 20px;
text-shadow: 0 2px 8px rgba(201,162,39,.18);

    }

    label {
display: block;
margin-top: 16px;
margin-bottom: 7px;
font-weight: 800;
font-size: 14px;
color: #333;

    }

    input, textarea, select {
width: 100%;
box-sizing: border-box;
padding: 13px 14px;
border: 1px solid #ddd;
border-radius: 11px;
font-size: 16px;
background: #fafafa;
color: var(--black);
transition: .2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--gold);
    }

    textarea {
      min-height: 100px;
    }

    button {
width: 100%;
margin-top: 22px;
padding: 14px;
border: none;
border-radius: 12px;
background: var(--black);
color: var(--gold-light);
font-size: 17px;
font-weight: 800;
cursor: pointer;
transition: .2s;
box-shadow: 0 5px 14px rgba(0,0,0,.12);
    }
  </style>

</head>

<body>

<div class="box">

<h1>➕ إضافة منتج جديد</h1>

  <label>اسم المنتج</label>
  <input type="text" placeholder="مثلاً: جاكيطة Nike">

  <label>الثمن</label>
  <input type="number" placeholder="مثلاً: 120">

  <label>القسم</label>
<label>المحل / المصدر</label>
<input type="text" id="productSource" placeholder="مثلاً: محل الحومة"> 
 <select>
    <option>ملابس</option>
    <option>صبابط</option>
    <option>إلكترونيات</option>
    <option>أثاث</option>
  </select>

  <label>الحالة</label>
  <select>
    <option>مزيانة</option>
    <option>متوسطة</option>
    <option>بحال جديدة</option>
  </select>

  <label>الوصف</label>
  <textarea rows="4" placeholder="كتب معلومات على المنتج..."></textarea>
<label>صورة المنتج</label>
<input type="file" id="imageFiles" accept="image/*" multiple>
<button onclick="addProduct()">إضافة المنتج</button>
</div>

<script>
 async function addProduct() {
const inputs = document.querySelectorAll('input[type="text"], input[type="number"]');
  const selects = document.querySelectorAll('select');
  const textarea = document.querySelector('textarea');

  const product = {
    name: inputs[0].value,
    price: Number(inputs[1].value),
    category: selects[0].value,
    condition: selects[1].value,
    description: textarea.value,
source: document.getElementById('productSource').value,  
};

const files = document.getElementById('imageFiles').files;
const formData = new FormData();
for (const file of files) {
  formData.append('images', file);
}
const uploadResponse = await fetch('/api/upload', {
  method: 'POST',
  body: formData
});

const uploadData = await uploadResponse.json();
product.images = uploadData.filenames;
product.image = uploadData.filenames[0];
fetch('/api/products', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(product)
  })
  .then(response => {
    if (response.ok) {
      alert('تمت إضافة المنتج بنجاح ✅');
    } else {
      alert('وقع مشكل ❌');
    }
  })
  .catch(error => {
    alert('وقع مشكل فالاتصال ❌');
  });
}

</script>
</body>
</html>
