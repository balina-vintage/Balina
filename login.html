<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balina - تسجيل الدخول</title>

<style>
    :root {
      --gold: #C9A227;
      --gold-light: #E5C158;
      --black: #111;
      --gray-light: #f5f5f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
      width: 90%;
      max-width: 350px;
      text-align: center;
      border-top: 4px solid var(--gold);
    }

    h1 {
      margin-bottom: 20px;
      color: var(--black);
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    input:focus {
      outline: none;
      border-color: var(--gold);
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: var(--black);
      color: var(--gold-light);
      font-size: 17px;
      font-weight: bold;
    }

    #error {
      color: red;
      margin-bottom: 10px;
      display: none;
    }
  </style>

  </style>
</head>

<body>

<div class="box">
  <h1>🔒 دخول الأدمين</h1>
  <p id="error">كلمة السر غلط</p>
  <input type="password" id="password" placeholder="كلمة السر">
  <button onclick="login()">دخول</button>
</div>

<script>
function login() {
  const password = document.getElementById('password').value;

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        window.location.href = '/admin.html';
      } else {
        document.getElementById('error').style.display = 'block';
      }
    });
}
</script>

</body>
</html>
